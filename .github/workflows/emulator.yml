name: Android emulator smoke test

# Installs the debug APK on a real Android image and checks that it starts, renders and keeps
# running. This is the only way to catch launch-time crashes (missing natives, bad manifest,
# shader compile failures) before shipping.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    name: Launch on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-emu-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-emu-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :android:assembleDebug --no-daemon --console=plain

      - name: Boot emulator, install and launch
        id: smoke
        shell: bash
        continue-on-error: true
        run: |
          set -x
          mkdir -p emulator-shots
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          if [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            yes | sdkmanager --install "emulator" "system-images;android-30;default;x86_64" > emulator-shots/sdk.log 2>&1
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          echo "no" | avdmanager create avd -n bgdx -k "system-images;android-30;default;x86_64" \
            -d pixel_2 --force >> emulator-shots/sdk.log 2>&1 || \
            avdmanager create avd -n bgdx -k "system-images;android-30;default;x86_64" --force >> emulator-shots/sdk.log 2>&1 || true

          ACCEL=auto
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is usable"
            KVM_FLAGS="-no-snapshot -no-window -gpu swiftshader_indirect"
          else
            echo "No usable KVM, running unaccelerated"
            ACCEL=off
            KVM_FLAGS="-no-snapshot -no-window -gpu swiftshader_indirect"
          fi
          ls -l /dev/kvm 2>&1 | head -2 >> emulator-shots/env.txt

          nohup emulator -avd bgdx -accel "$ACCEL" $KVM_FLAGS -no-audio -no-boot-anim \
            -memory 3072 -cores 2 -netdelay none -netspeed full \
            > emulator-shots/emulator.log 2>&1 &
          EMU_PID=$!
          echo "emulator pid $EMU_PID"

          adb start-server > /dev/null 2>&1
          BOOTED=0
          for i in $(seq 1 120); do
            STATE=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$STATE" = "1" ]; then BOOTED=1; echo "booted after $((i*5))s"; break; fi
            if ! kill -0 $EMU_PID 2>/dev/null; then echo "emulator process died"; break; fi
            sleep 5
          done
          if [ "$BOOTED" != "1" ]; then
            echo "EMULATOR_DID_NOT_BOOT"
            tail -40 emulator-shots/emulator.log
            exit 1
          fi

          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell wm dismiss-keyguard || true

          APK=$(find android/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "installing $APK"
          adb install -r -t "$APK" || exit 1
          adb logcat -c
          adb shell am start -W -n com.backrooms.gdx.debug/com.backrooms.gdx.android.AndroidLauncher || exit 1

          sleep 20
          adb exec-out screencap -p > emulator-shots/title.png || true
          adb shell input tap 640 360 || true     # "TAP TO ENTER"
          sleep 25
          adb exec-out screencap -p > emulator-shots/ingame.png || true
          adb shell input swipe 500 900 500 300 300 || true   # look around
          sleep 5
          adb exec-out screencap -p > emulator-shots/look.png || true

          PID=$(adb shell pidof com.backrooms.gdx.debug | tr -d '\r')
          echo "pid=[$PID]"
          adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -3 || true
          adb logcat -d > emulator-shots/logcat.txt || true
          grep -aE "AndroidRuntime|FATAL|UnsatisfiedLink|GLSL|libGDX|Backrooms|Perf|GL_INVALID" \
            emulator-shots/logcat.txt | tail -60 || true

          test -n "$PID" || { echo "FATAL: app not running"; exit 1; }
          if grep -qa "FATAL EXCEPTION" emulator-shots/logcat.txt; then
            echo "FATAL: crash in logcat"; exit 1
          fi
          echo "OK: app alive"

      - name: Upload emulator artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-shots
          path: emulator-shots
          if-no-files-found: warn

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Emulator smoke test for \`${GITHUB_SHA::7}\` — outcome: ${{ steps.smoke.outcome }}"
            echo '```'
            ls -la emulator-shots 2>/dev/null || true
            echo "--- env"
            cat emulator-shots/env.txt 2>/dev/null || true
            echo "--- emulator.log (tail)"
            tail -15 emulator-shots/emulator.log 2>/dev/null || true
            echo "--- logcat (filtered)"
            grep -aE "AndroidRuntime|FATAL|UnsatisfiedLink|GLSL|libGDX|Backrooms|Perf|GL_INVALID|E/" \
              emulator-shots/logcat.txt 2>/dev/null | tail -40 || echo "(no logcat)"
            echo '```'
          } > report.txt
          echo "----- report -----"
          cat report.txt
          gh issue comment 1 --body-file report.txt || gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/1/comments" -F body=@report.txt || true

      - name: Commit emulator screenshots
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p screenshots/android
          cp emulator-shots/*.png screenshots/android/ 2>/dev/null || true
          git add -f screenshots/android/*.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no new screenshots"
          else
            git commit -m "docs: emulator screenshots [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Fail the job when the app did not stay alive
        if: steps.smoke.outcome != 'success'
        run: |
          echo "The app did not start or did not stay alive on the emulator."
          echo "--- filtered logcat ---"
          grep -aE "AndroidRuntime|FATAL|UnsatisfiedLink|GLSL|libGDX|Backrooms|Perf|ActivityManager|am_proc" \
            emulator-shots/logcat.txt 2>/dev/null | tail -60 || true
          exit 1
