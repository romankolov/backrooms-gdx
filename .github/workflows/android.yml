name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (unit tests + debug APK + release APK)
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :core:test :android:assembleDebug :android:assembleRelease \
            --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Check native libraries are packaged
        shell: bash
        run: |
          set -e
          for f in $(find android/build/outputs/apk -name '*.apk'); do
            echo "== $f"
            unzip -l "$f" | grep -E 'lib/[^/]+/lib.*\.so' || {
              echo "FATAL: $f has no native libraries, it would crash on launch"; exit 1; }
            for abi in arm64-v8a armeabi-v7a x86_64; do
              unzip -l "$f" | grep -q "lib/$abi/libgdx.so" || {
                echo "FATAL: $f is missing lib/$abi/libgdx.so"; exit 1; }
            done
          done

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p artifacts
          find android/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Report APK
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "APK report for \`${GITHUB_SHA::7}\`"
            echo '```'
            ls -la artifacts
            for f in artifacts/*.apk; do
              echo "--- $f"
              unzip -l "$f" | grep -E "lib/|AndroidManifest|resources.arsc" | head -20; unzip -l "$f" | tail -1
            done
            echo '```'
          } > report.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" -f body="$(cat report.txt)" || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: backrooms-debug-apk
          path: artifacts/*debug*.apk
          if-no-files-found: error

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: backrooms-release-apk
          path: artifacts/*release*.apk
          if-no-files-found: warn

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

      # The job log is not always reachable from the build sandbox, so on failure the tail of
      # the compiler output is also posted as an issue comment where it can be read back.
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f build.log ]; then exit 0; fi
          BODY=$(printf 'Build failed on `%s`\n\n```\n%s\n```\n' "${GITHUB_SHA::7}" "$(tail -c 50000 build.log)")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/1/comments" -f body="$BODY" \
            || echo "could not comment"

      - name: Publish APK to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.apk
          generate_release_notes: true
