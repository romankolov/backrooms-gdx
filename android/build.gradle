apply plugin: "com.android.application"

android {
    namespace "com.backrooms.gdx"
    compileSdk 35

    defaultConfig {
        applicationId "com.backrooms.gdx"
        minSdk 24
        targetSdk 35
        versionCode rootProject.ext.appVersionCode
        versionName rootProject.ext.appVersionName
        // The game ships arm64 + armeabi-v7a native libraries; x86_64 keeps the
        // emulator happy. Drop the two x86 ABIs if you only target real phones.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile "AndroidManifest.xml"
            java.srcDirs = ["src/main/java"]
            res.srcDirs = ["res"]
            assets.srcDirs = [rootProject.file("assets")]
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Signed only when the CI/build environment provides a keystore.
            if (System.getenv("BACKROOMS_KEYSTORE") != null) {
                signingConfig signingConfigs.create("release") {
                    storeFile file(System.getenv("BACKROOMS_KEYSTORE"))
                    storePassword System.getenv("BACKROOMS_KEYSTORE_PASSWORD")
                    keyAlias System.getenv("BACKROOMS_KEY_ALIAS")
                    keyPassword System.getenv("BACKROOMS_KEY_PASSWORD")
                }
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ["META-INF/robovm/ios/robovm.xml", "META-INF/versions/**"]
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

}
